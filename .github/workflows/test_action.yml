name: Test Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ecs-service-deploy
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Scale-up / deploy service
        uses: ./
        with:
          cluster_arn: ${{ vars.AWS_ECS_CLUSTER_ARN }}
          service_name: ${{ vars.AWS_ECS_SERVICE_NAME }}
          region: ${{ vars.AWS_REGION }}
          desired_count: 1
          wait: true

      - name: Re-deploy service
        uses: ./
        with:
          cluster_arn: ${{ vars.AWS_ECS_CLUSTER_ARN }}
          service_name: ${{ vars.AWS_ECS_SERVICE_NAME }}
          region: ${{ vars.AWS_REGION }}
          force_new_deployment: true
          wait: true

      - name: Scale-down service
        uses: ./
        with:
          cluster_arn: ${{ vars.AWS_ECS_CLUSTER_ARN }}
          service_name: ${{ vars.AWS_ECS_SERVICE_NAME }}
          region: ${{ vars.AWS_REGION }}
          desired_count: 0
          wait: true
